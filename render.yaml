services:
  - type: web
    name: roadpulse-api
    runtime: node
    region: singapore
    plan: free
    branch: dev
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run migrate && npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: roadpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: roadpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: MAP_API_KEY
        sync: false
      - key: MAP_TRAFFIC_VALIDATED
        value: "false"
      - key: MAP_LANGUAGE
        value: fr-FR
      - key: TRUST_PROXY
        value: "1"

  - type: keyvalue
    name: roadpulse-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"

databases:
  - name: roadpulse-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: roadpulse
    user: roadpulse
    ipAllowList: []